<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            border: solid red;
            margin-top: 100px;
            margin-bottom: 50px;
            margin-left: 150px;
            margin-right: 200px;
            padding-left: 50px;
            padding-bottom: 40px;
            padding-right: 60px;
            padding-top: 70px;
            outline-style: double;
            outline-color: aqua;
            outline-width: 20px;
            outline-offset: 30px;
            width: 200px;
            color: aqua;
            background-color: black;
            text-align: center;
            text-decoration-line: underline;
            text-decoration-color: #f123f2;
            text-decoration-style: wavy;
            text-decoration-thickness: 5px;
            word-spacing: 10px;

        }
        h2{
            border: groove;
            margin-top: 150px;
            margin-bottom: 200px;
            margin-right: 250px;
            margin-left: 100px;
            text-align: right;
            text-decoration: line-through black double 5px;
        }
        h3{
            border: dashed;
            width: 150px;
            margin: auto;
            letter-spacing: 20px;
            text-shadow: 4px 4px 5px red,10px 0 5px rgb(159, 200, 250);
        }
        div{
            border: solid;
            margin-right: 50px;
            background-color: aqua;
            width: 70%;
            max-width: 55px;
            height: 90px;
            outline: groove 50px aqua;
        }
        div p{
            margin-right:inherit;
            margin-left:30px ;
            margin-top:60px ;
            margin-bottom:70px ;
            padding: 40px 50px 70px 30px;
        }
        h4{
            border: groove;
            width: 250px;
            margin: 70px auto;
            outline: groove;
            outline-offset: 30px;
            text-align: justify;
            text-align-last: center;
            text-transform: capitalize;
            text-indent: 60px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <h1>Computer nova</h1>
    <h2>Mohamed</h2>
    <h3>Yahya</h3>
    <div>
        <p>Madrid</p>
    </div>
    <h4>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dignissimos est voluptas nam, voluptates temporibus ratione. Nobis quis ipsum praesentium voluptatum incidunt obcaecati libero unde quo provident ducimus nisi, dicta temporibus?</h4>
</body>
</html>
